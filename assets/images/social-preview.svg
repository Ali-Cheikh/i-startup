<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#161616" />
  
  <!-- Carbon Grid Background -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Draw the top and left lines of the square -->
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Blue Bar -->
  <rect x="0" y="0" width="1200" height="10" fill="#0f62fe" />

  <!-- Logo Container (White Box) -->
  <g transform="translate(80, 100)">
    <rect width="90" height="90" fill="#f4f4f4" />
    
    <!-- Structural "I" Icon (Scaled to fit inside the 90x90 box) -->
    <g transform="translate(10, 10) scale(0.7)">
      <!-- Black I -->
      <rect x="24" y="24" width="16" height="52" fill="#161616" />
      <!-- Blue Chevron -->
      <path d="M 48 24 L 80 50 L 48 76 V 62 L 64 50 L 48 38 Z" fill="#0f62fe" />
    </g>
  </g>

  <!-- Main Title: I-StartUp -->
  <text x="80" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="110" fill="#f4f4f4" letter-spacing="-3">
    <tspan>I-Start</tspan><tspan fill="#0f62fe">Up</tspan>
  </text>

  <!-- Blue Underline -->
  <rect x="80" y="310" width="200" height="8" fill="#0f62fe" />

  <!-- Tagline -->
  <text x="80" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="42" fill="#0f62fe">
    Improve the business you already run.
  </text>

  <!-- Sub-description -->
  <text x="80" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#8d8d8d" letter-spacing="0.5">
    Product engineering · Automation · Better operations
  </text>

  <!-- Website URL (Monospace) -->
  <text x="80" y="550" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="24" fill="#0f62fe" letter-spacing="2">
    I-STARTUP.TN
  </text>

  <!-- Right side decorative elements (Optional: mimics the grid blocks in your image) -->
  <rect x="800" y="100" width="320" height="430" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
</svg>